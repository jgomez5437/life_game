<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Start a Life - Free Online Life Simulator Game</title>
    <meta name="description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta name="keywords" content="free online game, browser game, strategy game, life simulator, life sim, Start a Life">

    <link rel="canonical" href="https://startalife.app/">
    <meta name="google-site-verification" content="googledf776645404b02c1" />
    <meta name="google-site-verification" content="uJ4UEaQT-I2nkXOUoLKkAjrz08jYv_A083cquQFwLhU" />

    <!-- Open Graph / Facebook  -->
    <meta property="og:site_name" content="Start a Life">
    <meta property="og:title" content="Start a Life - Free Online Life Simulator Game">
    <meta property="og:description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://startalife.app">
    <meta property="og:image" content="https://startalife.app/preview.png">

    <!-- Google WebSite Structured Data (Site Name) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Start a Life",
      "alternateName": [
        "Start a Life - Life Simulator",
        "Start a Life Game"
      ],
      "url": "https://startalife.app/"
    }
    </script>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Start a Life - Free Online Life Simulator Game">
    <meta name="twitter:description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta name="twitter:image" content="https://startalife.app/preview.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.bundle.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        if (localStorage.getItem('life_game_theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('light-mode'));
        }
    </script>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

    <!-- Header Stats Bar (Persistent) -->
    <header class="bg-slate-800 border-b border-slate-700 px-3 py-2 sm:py-2.5 shadow-lg z-10 flex justify-center items-center shrink-0 min-h-[4rem]">
        <div class="w-full max-w-lg mx-auto flex flex-col gap-1.5 px-1">
            <!-- Header Brand / Logo for Login Screen -->
            <div id="header-brand" class="flex items-center justify-center gap-2 font-bold text-white text-lg tracking-wide select-none mx-auto py-1">
                <i class="fas fa-globe-americas text-blue-400"></i>
                <span>Start a Life</span>
            </div>

            <!-- In-Game Player Info Row 1: Top Bar (Identity & Finances) -->
            <div id="header-main-row" class="w-full flex justify-between items-center hidden">
                <!-- Left: Avatar + Name + Age -->
                <div id="header-user-info" data-action="openPlayerOverviewModal" class="flex items-center gap-2.5 cursor-pointer hover:opacity-90 transition group select-none min-w-0" title="Click for Life Overview">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-700 overflow-hidden flex items-center justify-center border-2 border-slate-600 group-hover:border-blue-400 transition shrink-0" id="avatar-container">
                        <i class="fas fa-user text-slate-400"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 id="header-name" class="font-bold text-xs sm:text-sm leading-tight text-white group-hover:text-blue-300 transition truncate">Player</h1>
                        <div class="text-[11px] sm:text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                            <span>Age: <span id="header-age" class="text-white font-bold">0</span></span>
                        </div>
                    </div>
                </div>

                <!-- Right: In-Game Controls & Bank -->
                <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
                    <div id="header-bank-wrapper" class="text-right relative">
                        <div id="header-bank" class="font-bold text-green-400 text-sm sm:text-base leading-tight">$0</div>
                        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Bank</div>
                    </div>
                    <button id="header-settings-btn" data-action="openSettingsModal" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-600/70 flex items-center justify-center transition-colors shadow-sm ml-1" title="Settings">
                        <i class="fas fa-cog text-sm sm:text-base"></i>
                    </button>
                </div>
            </div>

            <!-- In-Game Player Info Row 2: Crisp 4-Stat Ribbon -->
            <div id="header-stats-ribbon" data-action="openPlayerOverviewModal" class="w-full grid grid-cols-4 gap-1.5 sm:gap-2 cursor-pointer select-none hidden" title="Click for Life Overview">
                <!-- Health -->
                <div id="health-container" class="header-stat-pill relative bg-slate-900/60 hover:bg-slate-900/90 border border-slate-700/60 hover:border-emerald-500/40 rounded-lg py-1 px-1.5 sm:px-2 flex items-center justify-center gap-1.5 transition text-green-400">
                    <div class="header-stat-fill-track">
                        <div id="health-bar-fill" class="header-stat-fill bg-emerald-500/15" style="width: 100%;"></div>
                    </div>
                    <i class="fas fa-heart text-[10px] sm:text-xs shrink-0 relative z-10"></i>
                    <span id="ui-health" class="text-[11px] sm:text-xs font-bold font-mono relative z-10">100%</span>
                </div>
                <!-- Happiness -->
                <div id="happiness-container" class="header-stat-pill relative bg-slate-900/60 hover:bg-slate-900/90 border border-slate-700/60 hover:border-amber-500/40 rounded-lg py-1 px-1.5 sm:px-2 flex items-center justify-center gap-1.5 transition text-amber-400">
                    <div class="header-stat-fill-track">
                        <div id="happiness-bar-fill" class="header-stat-fill bg-amber-500/15" style="width: 100%;"></div>
                    </div>
                    <i class="fas fa-smile text-[10px] sm:text-xs shrink-0 relative z-10"></i>
                    <span id="ui-happiness" class="text-[11px] sm:text-xs font-bold font-mono relative z-10">100%</span>
                </div>
                <!-- Smarts -->
                <div id="smarts-container" class="header-stat-pill relative bg-slate-900/60 hover:bg-slate-900/90 border border-slate-700/60 hover:border-blue-500/40 rounded-lg py-1 px-1.5 sm:px-2 flex items-center justify-center gap-1.5 transition text-blue-400">
                    <div class="header-stat-fill-track">
                        <div id="smarts-bar-fill" class="header-stat-fill bg-blue-500/15" style="width: 50%;"></div>
                    </div>
                    <i class="fas fa-brain text-[10px] sm:text-xs shrink-0 relative z-10"></i>
                    <span id="ui-smarts" class="text-[11px] sm:text-xs font-bold font-mono relative z-10">50%</span>
                </div>
                <!-- Looks -->
                <div id="looks-container" class="header-stat-pill relative bg-slate-900/60 hover:bg-slate-900/90 border border-slate-700/60 hover:border-pink-500/40 rounded-lg py-1 px-1.5 sm:px-2 flex items-center justify-center gap-1.5 transition text-pink-400">
                    <div class="header-stat-fill-track">
                        <div id="looks-bar-fill" class="header-stat-fill bg-pink-500/15" style="width: 50%;"></div>
                    </div>
                    <i class="fas fa-sparkles text-[10px] sm:text-xs shrink-0 relative z-10"></i>
                    <span id="ui-looks" class="text-[11px] sm:text-xs font-bold font-mono relative z-10">50%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main id="game-container" class="flex-1 overflow-y-auto p-4 relative bg-slate-900">
        <div id="initial-loader" class="h-full flex flex-col items-center justify-center fade-in text-center p-6 select-none">
            <div class="mb-6 relative">
                <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-25 rounded-full"></div>
                <i class="fas fa-globe-americas text-7xl text-blue-400 relative z-10 animate-pulse"></i>
            </div>
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-400 mb-4"></i>
            <h2 class="text-xl font-bold text-white mb-1 tracking-wide">Loading Start a Life...</h2>
            <p class="text-slate-400 text-sm max-w-xs leading-relaxed">Connecting to account & cloud save data...</p>
        </div>
    </main>

    <!-- Persistent Global Bottom Navigation Bar -->
    <nav id="bottom-nav" class="bg-slate-800 border-t border-slate-700 px-3 py-2 shadow-lg z-10 shrink-0 hidden select-none" aria-label="Main Navigation">
        <div id="bottom-nav-container" class="w-full max-w-lg mx-auto grid grid-cols-5 gap-1.5 sm:gap-2 h-16 sm:h-18">
            <!-- 1. Assets Tab -->
            <button id="nav-btn-assets" data-action="renderAssets" class="btn-nav text-slate-200 font-bold rounded-xl shadow-lg flex flex-col items-center justify-center hover:bg-slate-700 transition" title="Assets">
                <i class="fas fa-coins mb-1 text-lg sm:text-xl text-yellow-400"></i>
                <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold">Assets</span>
            </button>

            <!-- 2. Work Tab -->
            <button id="nav-btn-work" data-action="renderActivities" class="btn-nav text-slate-200 font-bold rounded-xl shadow-lg flex flex-col items-center justify-center hover:bg-slate-700 transition" title="Work & Education">
                <i class="fas fa-user-graduate mb-1 text-lg sm:text-xl text-blue-400"></i>
                <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold">Work</span>
            </button>

            <!-- 3. Dynamic Center Button (Age Up on Home / Home on Sub-Views) -->
            <button id="nav-btn-center" data-action="ageUp" class="btn-age-up btn-primary text-white font-bold rounded-xl shadow-lg flex flex-col items-center justify-center transition" title="Age Up (+1 Year)">
                <i class="fas fa-arrow-up mb-1 text-lg sm:text-xl"></i>
                <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold">Age Up +</span>
            </button>

            <!-- 4. Social Tab -->
            <button id="nav-btn-social" data-action="renderRelationships" class="btn-nav text-slate-200 font-bold rounded-xl shadow-lg flex flex-col items-center justify-center hover:bg-slate-700 transition" title="Relationships & Social">
                <i class="fas fa-users mb-1 text-lg sm:text-xl text-pink-400"></i>
                <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold">Social</span>
            </button>

            <!-- 5. More Tab -->
            <button id="nav-btn-more" data-action="renderMoreDashboard" class="btn-nav text-slate-200 font-bold rounded-xl shadow-lg flex flex-col items-center justify-center hover:bg-slate-700 transition" title="More Options & Activities">
                <i class="fas fa-ellipsis-h mb-1 text-lg sm:text-xl text-slate-400"></i>
                <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold">More</span>
            </button>
        </div>
    </nav>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl flex flex-col max-h-[85vh] overflow-hidden my-auto">
            <!-- Modal Header (Title + Inline Exit Button) -->
            <div id="modal-header" class="flex items-center justify-between gap-3 mb-3 shrink-0">
                <h2 id="modal-title" class="text-xl font-bold text-white truncate">Alert</h2>
                <button id="modal-close-btn" class="w-8 h-8 rounded-full bg-slate-700/60 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-600/50 flex items-center justify-center transition shrink-0" title="Close" aria-label="Close modal">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
            <div id="modal-content" class="text-slate-300 overflow-y-auto pr-1 flex-1 space-y-3"></div>
            <div id="modal-actions" class="w-full shrink-0 mt-4">
                <button id="modal-btn" class="w-full btn-primary text-white font-bold py-3 rounded-lg">Dismiss</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script type="module" src="src/core/main.js"></script>
</body>
</html>
