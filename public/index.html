<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Start a Life - Free Online Life Simulator Game</title>
    <meta name="description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta name="keywords" content="free online game, browser game, strategy game, life simulator, life sim, Start a Life">

    <link rel="canonical" href="https://startalife.vercel.app/">
    <meta name="google-site-verification" content="googledf776645404b02c1" />
    <meta name="google-site-verification" content="uJ4UEaQT-I2nkXOUoLKkAjrz08jYv_A083cquQFwLhU" />

    <!-- Open Graph / Facebook  -->
    <meta property="og:site_name" content="Start a Life">
    <meta property="og:title" content="Start a Life - Free Online Life Simulator Game">
    <meta property="og:description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://startalife.vercel.app">
    <meta property="og:image" content="https://startalife.vercel.app/preview.png">

    <!-- Google WebSite Structured Data (Site Name) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Start a Life",
      "alternateName": [
        "Start a Life - Life Simulator",
        "Start a Life Game"
      ],
      "url": "https://startalife.vercel.app/"
    }
    </script>

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Start a Life - Free Online Life Simulator Game">
    <meta name="twitter:description" content="Play Start a Life online for free. Create your character, build relationships, manage careers, and navigate life choices in this addictive browser life simulator game.">
    <meta name="twitter:image" content="https://startalife.vercel.app/preview.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.bundle.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        if (localStorage.getItem('life_game_theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('light-mode'));
        }
    </script>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

    <!-- Header Stats Bar (Persistent) -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 shadow-lg z-10 flex justify-center items-center h-16 shrink-0">
        <div class="w-full max-w-lg mx-auto flex justify-between items-center px-1">
            <!-- Header Brand / Logo for Login Screen -->
            <div id="header-brand" class="flex items-center justify-center gap-2 font-bold text-white text-lg tracking-wide select-none mx-auto">
                <i class="fas fa-globe-americas text-blue-400"></i>
                <span>Start a Life</span>
            </div>

            <!-- In-Game Player Info -->
            <div id="header-user-info" data-action="openPlayerOverviewModal" class="flex items-center gap-3 cursor-pointer hover:opacity-90 transition group select-none hidden" title="Click for Life Overview">
                <div class="w-10 h-10 rounded-full bg-slate-700 overflow-hidden flex items-center justify-center border-2 border-slate-600 group-hover:border-blue-400 transition" id="avatar-container">
                    <i class="fas fa-user text-slate-400"></i>
                </div>
                <div>
                    <h1 id="header-name" class="font-bold text-sm leading-tight text-white group-hover:text-blue-300 transition">Player</h1>
                    <div class="text-xs text-slate-400 flex items-center gap-3 mt-1">
                        <div>Age: <span id="header-age" class="text-white font-bold">0</span></div>
                        <div id="health-container" class="font-bold flex items-center transition-colors duration-300 text-green-400">
                            <i class="fas fa-heart mr-1"></i>
                            <span id="ui-health">100%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- In-Game Controls & Bank -->
            <div class="flex items-center gap-3">
                <div id="header-bank-wrapper" class="text-right hidden">
                    <div id="header-bank" class="font-bold text-green-400 text-lg">$0</div>
                    <div class="text-xs text-slate-500 uppercase tracking-wider">Bank Account</div>
                </div>
                <button id="header-settings-btn" data-action="openSettingsModal" class="w-9 h-9 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-600/70 flex items-center justify-center transition-colors shadow-sm ml-1 hidden" title="Settings">
                    <i class="fas fa-cog text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main id="game-container" class="flex-1 overflow-y-auto p-4 relative bg-slate-900">
        <div id="initial-loader" class="h-full flex flex-col items-center justify-center fade-in text-center p-6 select-none">
            <div class="mb-6 relative">
                <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-25 rounded-full"></div>
                <i class="fas fa-globe-americas text-7xl text-blue-400 relative z-10 animate-pulse"></i>
            </div>
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-400 mb-4"></i>
            <h2 class="text-xl font-bold text-white mb-1 tracking-wide">Loading Start a Life...</h2>
            <p class="text-slate-400 text-sm max-w-xs leading-relaxed">Connecting to account & cloud save data...</p>
        </div>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl flex flex-col max-h-[85vh] overflow-hidden my-auto">
            <h2 id="modal-title" class="text-xl font-bold mb-3 text-white shrink-0">Alert</h2>
            <div id="modal-content" class="text-slate-300 overflow-y-auto pr-1 flex-1 space-y-3"></div>
            <div id="modal-actions" class="w-full shrink-0 mt-4">
                <button id="modal-btn" class="w-full btn-primary text-white font-bold py-3 rounded-lg">Dismiss</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script type="module" src="src/core/main.js"></script>
</body>
</html>
